# ABOUTME: bf16 LoRA SFT config for Qwen3.6-27B on the thick difficult-advice + TULU3 mixture.
# ABOUTME: Copy of the replication's 20/80 full-sequence config (commit 775179af); only data_path, output_dir and max_seq_len differ.

seed: 0
model: "Qwen/Qwen3.6-27B"

# Qwen3.6-27B ships as a vision-language checkpoint (Qwen3_5ForConditionalGeneration),
# so it must be loaded through the image-text-to-text auto class.
model_class: "image_text_to_text"

# Pre-rendered mixture: difficult-advice WITH <think> traces, TULU3 with no think block.
# train_edited.jsonl = train.jsonl + the 29 hand edits in edits.json (see edits_report.json).
data_path: "data/train_edited.jsonl"
output_dir: "output/train_lora_qwen36_thick"

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  # Regex restricted to the language model so the vision tower's identically-named
  # projections are left untouched. Verified against real module paths in --smoke.
  target_modules: "model\\.language_model\\..*\\.(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)$"

train:
  epochs: 1
  batch_size: 1
  grad_accum: 16
  lr: 1.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  logging_steps: 5
  # 3072, not 2048: the longest thick row is 2,723 tokens, so no row is truncated.
  # Every Tulu row is <= 2,048 tokens, so Tulu is unaffected.
  max_seq_len: 3072
  # TRL only guarantees packed-sequence isolation under Flash Attention variants; under
  # sdpa it warns of cross-contamination between samples, so packing stays off.
  packing: false
  assistant_only_loss: false
  attn_implementation: sdpa
  # bitsandbytes 4-bit does not reliably cover this model's linear-attention/SSM
  # layers; 54GB of bf16 weights + LoRA + checkpointing fits an 80GB card.
  load_in_4bit: false
